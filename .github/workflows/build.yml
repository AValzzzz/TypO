name: TypO multiplatforme executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write 

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build Native Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage \
            --type app-image \
            --name TypO \
            --input target/ \
            --main-jar TypO.jar \
            --main-class com.example.Launcher \
            --java-options "-Xmx256m" \
            --dest output/
          tar -czvf TypO-linux.tar.gz -C output TypO

      - name: Upload Linux Artifacts to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/TypO.jar
            TypO-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          jpackage `
            --type app-image `
            --name TypO `
            --input target/ `
            --main-jar TypO.jar `
            --main-class com.example.Launcher `
            --java-options "-Xmx256m" `
            --dest output/
          Compress-Archive -Path output/TypO -DestinationPath TypO-windows.zip

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypO-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage \
            --type dmg \
            --name TypO \
            --input target/ \
            --main-jar TypO.jar \
            --main-class com.example.Launcher \
            --java-options "-Xmx256m" \
            --dest output/
          mv output/*.dmg TypO-mac.dmg

      - name: Upload macOS Artifacts to Release
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypO-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git binutils fakeroot

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Set up Maven
        run: pacman -S --noconfirm --needed maven

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build Native App Image (Arch Linux)
        run: |
          jpackage \
            --type app-image \
            --name TypO \
            --input target/ \
            --main-jar TypO.jar \
            --main-class com.example.Launcher \
            --icon src/main/resources/com/example/logo.png \
            --java-options "-Xmx256m" \
            --dest output/

      - name: Build pacman package (.pkg.tar.zst)
        run: |
          # pkgver cannot contain '-', so v1.2.3-beta becomes 1.2.3_beta
          PKGVER="${GITHUB_REF_NAME#v}"
          PKGVER="${PKGVER//-/_}"

          mkdir -p pkgbuild
          cp -r output/TypO pkgbuild/TypO
          cp src/main/resources/com/example/logo.png pkgbuild/typo.png

          cat > pkgbuild/typo.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TypO
          Exec=/opt/typo/bin/TypO %F
          Icon=typo
          Terminal=false
          Categories=Office;TextEditor;
          EOF

          cat > pkgbuild/PKGBUILD <<'EOF'
          pkgname=typo
          pkgver=@PKGVER@
          pkgrel=1
          pkgdesc="TypO text editor"
          arch=('x86_64')
          url="https://github.com/@REPO@"
          license=('custom')
          depends=('gtk3' 'libxtst' 'libxrender' 'libxi' 'alsa-lib' 'freetype2')
          options=('!strip' '!debug')

          package() {
            install -dm755 "$pkgdir/opt/typo"
            cp -a "$startdir/TypO/." "$pkgdir/opt/typo/"

            install -dm755 "$pkgdir/usr/bin"
            ln -s /opt/typo/bin/TypO "$pkgdir/usr/bin/typo"

            install -Dm644 "$startdir/typo.desktop" "$pkgdir/usr/share/applications/typo.desktop"
            install -Dm644 "$startdir/typo.png" "$pkgdir/usr/share/pixmaps/typo.png"
          }
          EOF
          sed -i "s|@PKGVER@|${PKGVER}|; s|@REPO@|${GITHUB_REPOSITORY}|" pkgbuild/PKGBUILD

          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder:builder pkgbuild
          su builder -c "cd pkgbuild && makepkg --nodeps --noconfirm"

          mv pkgbuild/typo-*.pkg.tar.zst TypO-arch-x86_64.pkg.tar.zst

      - name: Upload Arch Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypO-arch-x86_64.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

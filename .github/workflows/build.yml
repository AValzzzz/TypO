name: TypO multiplatforme executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write 

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build Native Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage \
            --type app-image \
            --name TypO \
            --input target/ \
            --main-jar TypO.jar \
            --main-class com.example.Launcher \
            --java-options "-Xmx256m" \
            --dest output/
          tar -czvf TypO-linux.tar.gz -C output TypO

      - name: Upload Linux Artifacts to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/TypO.jar
            TypO-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage `
            --type exe `
            --name TypO `
            --input target/ `
            --main-jar TypO.jar `
            --main-class com.example.Launcher `
            --java-options "-Xmx256m" `
            --dest output/
          ren output\*.exe TypO-windows.exe

      - name: Upload Windows Artifacts to Release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypO-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage \
            --type dmg \
            --name TypO \
            --input target/ \
            --main-jar TypO.jar \
            --main-class com.example.Launcher \
            --java-options "-Xmx256m" \
            --dest output/
          mv output/*.dmg TypO-mac.dmg

      - name: Upload macOS Artifacts to Release
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypO-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}